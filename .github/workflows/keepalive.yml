name: Supabase keep-alive

# Supabase free-tier projects pause after ~7 days of inactivity.
# This pings the REST API twice a week so the project never goes idle.
# Requires repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY

on:
  schedule:
    - cron: '0 12 * * 1,4'   # Mondays and Thursdays, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -f \
            "${{ secrets.SUPABASE_URL }}/rest/v1/families?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Ping succeeded."
